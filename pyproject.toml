[project]
name = "solarian-arm-1"
version = "0.1.0"
description = "Solarian Arm 1 module for the Solarian robotics framework"
authors = [
    {name = "Raul Garreta", email = "raul@solarian.dev"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = [
    "solarian>=0.1.0",
    "solarian-feetech>=0.1.0",
]

[project.optional-dependencies]
# The servo SDKs, for the machine wired to the arm. Without them the module
# still imports, so a relay or controller can build the robot's schema.
hardware = [
    "solarian-feetech[hardware]>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solarian_arm_1*"]

[tool.setuptools.package-data]
solarian_arm_1 = [
    "conf_arm.yaml",
    "assets/arm1.xml",
    "assets/arm1_description/config.json",
    "assets/arm1_description/meshes/*.stl",
]

[project.entry-points."solarian.modules"]
arm-1 = "solarian_arm_1.arm:Arm1Module"
