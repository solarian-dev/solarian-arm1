<!doctype html><html><head><style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body><canvas id=c></canvas><script>
const cv=document.getElementById('c');
let gl, prog, lprog, meshes={};
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
function pg(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p}
window.init=async function(W,H,names){
  cv.width=W;cv.height=H;
  gl=cv.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
  prog=pg(`#version 300 es
  in vec3 p; in vec3 n; uniform mat4 M,VP; out vec3 wn; out vec3 wp;
  void main(){vec4 w=M*vec4(p,1.);wp=w.xyz;wn=mat3(M)*n;gl_Position=VP*w;}`,
  `#version 300 es
  precision highp float; in vec3 wn; in vec3 wp; uniform vec3 col,eye; uniform float alpha; uniform float hl; uniform vec4 clip; out vec4 o;
  void main(){ if(dot(wp,clip.xyz)>clip.w) discard;vec3 N=normalize(wn); vec3 V=normalize(eye-wp); if(dot(N,V)<0.)N=-N;
   vec3 L1=normalize(vec3(0.4,-0.6,0.8)); vec3 L2=normalize(vec3(-0.7,0.3,0.4));
   float d=0.55*max(dot(N,L1),0.)+0.25*max(dot(N,L2),0.); float hemi=0.5+0.5*N.z;
   vec3 H=normalize(L1+V); float s=pow(max(dot(N,H),0.),40.)*0.25;
   vec3 c=col*(0.32+0.18*hemi+d)+vec3(s); c=mix(c,vec3(1.0,0.55,0.1),hl*0.0);
   o=vec4(c,alpha);}`);
  lprog=pg(`#version 300 es
  in vec3 p; uniform mat4 M,VP; out vec3 wp; void main(){vec4 w=M*vec4(p,1.);wp=w.xyz;gl_Position=VP*w;}`,
  `#version 300 es
  precision highp float; uniform vec4 col; uniform vec4 clip; in vec3 wp; out vec4 o; void main(){ if(dot(wp,clip.xyz)>clip.w) discard; o=col;}`);
  for(const nm of names){
    const t=new Float32Array(await (await fetch('data/'+nm+'.tri')).arrayBuffer());
    const e=new Float32Array(await (await fetch('data/'+nm+'.edg')).arrayBuffer());
    const vao=gl.createVertexArray();gl.bindVertexArray(vao);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,t,gl.STATIC_DRAW);
    let lp=gl.getAttribLocation(prog,'p'),ln=gl.getAttribLocation(prog,'n');
    gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,3,gl.FLOAT,false,24,0);
    gl.enableVertexAttribArray(ln);gl.vertexAttribPointer(ln,3,gl.FLOAT,false,24,12);
    const lvao=gl.createVertexArray();gl.bindVertexArray(lvao);
    const lb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,lb);gl.bufferData(gl.ARRAY_BUFFER,e,gl.STATIC_DRAW);
    const llp=gl.getAttribLocation(lprog,'p');gl.enableVertexAttribArray(llp);gl.vertexAttribPointer(llp,3,gl.FLOAT,false,12,0);
    meshes[nm]={vao,n:t.length/6,lvao,ln:e.length/3};
  }
  return Object.keys(meshes).length;
}
function mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o}
function lookAt(e,t,u){const z=norm(sub(e,t)),x=norm(cross(u,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])}
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0])}
function ortho(h,a,n,f){return new Float32Array([1/(h*a),0,0,0,0,1/h,0,0,0,0,-2/(f-n),0,0,0,-(f+n)/(f-n),1])}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(...a);return a.map(x=>x/l)};
// scene: {bg:[r,g,b], cam:{target,yaw,pitch,dist,fov,ortho}, parts:[{mesh,M(16, row-major, mm),col,alpha,edges}]}
window.draw=function(s){
  const W=cv.width,H=cv.height; gl.viewport(0,0,W,H);
  const bg=s.bg||[1,1,1]; gl.clearColor(bg[0],bg[1],bg[2],1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  const c=s.cam, y=c.yaw*Math.PI/180, p=c.pitch*Math.PI/180;
  const eye=[c.target[0]+c.dist*Math.cos(p)*Math.cos(y), c.target[1]+c.dist*Math.cos(p)*Math.sin(y), c.target[2]+c.dist*Math.sin(p)];
  const V=lookAt(eye,c.target,[0,0,1]); const P=c.ortho?ortho(c.ortho,W/H,1,5000):persp((c.fov||30)*Math.PI/180,W/H,5,5000);
  const VP=mul(P,V);
  const order=[...s.parts].sort((a,b)=>(b.alpha??1)-(a.alpha??1));
  for(const part of order){
    const m=meshes[part.mesh]; if(!m) continue; const R=part.M;
    const M=new Float32Array([R[0],R[4],R[8],0,R[1],R[5],R[9],0,R[2],R[6],R[10],0,R[3],R[7],R[11],1]);
    const a=part.alpha??1;
    gl.useProgram(prog); gl.uniformMatrix4fv(gl.getUniformLocation(prog,'M'),false,M); gl.uniformMatrix4fv(gl.getUniformLocation(prog,'VP'),false,VP);
    gl.uniform3fv(gl.getUniformLocation(prog,'col'),part.col); gl.uniform3fv(gl.getUniformLocation(prog,'eye'),eye);
    gl.uniform1f(gl.getUniformLocation(prog,'alpha'),a); gl.uniform4fv(gl.getUniformLocation(prog,'clip'),s.clip||[0,0,0,1]); gl.uniform1f(gl.getUniformLocation(prog,'hl'),part.hl||0);
    if(a<1){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);} else {gl.disable(gl.BLEND);gl.depthMask(true);}
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1,1);
    gl.bindVertexArray(m.vao); gl.drawArrays(gl.TRIANGLES,0,m.n); gl.disable(gl.POLYGON_OFFSET_FILL);
    if(part.edges!==false){ gl.useProgram(lprog); gl.uniformMatrix4fv(gl.getUniformLocation(lprog,'M'),false,M); gl.uniformMatrix4fv(gl.getUniformLocation(lprog,'VP'),false,VP);
      gl.uniform4fv(gl.getUniformLocation(lprog,'clip'),s.clip||[0,0,0,1]); const ec=part.ecol||[0.12,0.12,0.14]; gl.uniform4f(gl.getUniformLocation(lprog,'col'),ec[0],ec[1],ec[2],a<1?a*0.6:1);
      if(a<1){gl.enable(gl.BLEND);} gl.bindVertexArray(m.lvao); gl.drawArrays(gl.LINES,0,m.ln); }
    gl.depthMask(true); gl.disable(gl.BLEND);
  }
  gl.finish(); return true;
}
</script></body></html>
