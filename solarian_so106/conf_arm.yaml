# Default configuration for So106ArmModule.
#
# Copied into a project's conf/ directory (e.g. conf/right_arm.yaml).
# Set actuator_port / servo ids to match the installed hardware. sim_joint
# names must match the ModuleAttachment prefix used in the robot scene.

actuator_port: /dev/ttyACM0
frequency: 90
interpolator_type: pose
drive_waypoints: true
drive_horizon_multiplier: 2.5
max_speed: [0.25, 0.6]

# Simulated with the plugin MJCF (ARM_MJCF_PATH) attached under the `arm/`
# prefix, so joints become `arm/shoulder_pan` .. `arm/wrist_roll`.
# sim_range_* are the MJCF joint limits (radians).
# Optional per-joint ``model:`` (e.g. sts3215) overrides the module default.
actuators:
    shoulder_pan:
        id: 1
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/shoulder_pan"
        sim_range_min: -2.228991978
        sim_range_max: 2.081971274
    shoulder_lift:
        id: 2
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/shoulder_lift"
        sim_range_min: -1.798771234
        sim_range_max: 1.780235837
    elbow_flex:
        id: 3
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/elbow_flex"
        sim_range_min: -1.780235837
        sim_range_max: 1.570796327
    wrist_flex:
        id: 4
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/wrist_flex"
        sim_range_min: -3.141592654
        sim_range_max: 3.141592654
    wrist_yaw:
        id: 5
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/wrist_yaw"
        sim_range_min: -3.141592654
        sim_range_max: 3.141592654
    wrist_roll:
        id: 6
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/wrist_roll"
        sim_range_min: -3.141592654
        sim_range_max: 3.141592654
